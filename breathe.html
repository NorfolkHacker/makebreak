<body>
<canvas id="c" width="420" height="420"></canvas>
<div class="scan"></div>
<div class="cap">
  <b><span class="m">MAKE</span> / <span class="g">BREAK</span></b> · issue #00 — a screen that breathes<br>
  ~30 lines of vanilla JS. <span class="hint">View source. Change the 0.04s. Break it.</span><br>
  <a href="https://makebreak.co.uk">← the zine</a>
</div>
<script>
// Old-school plasma. Sum some sine waves for the shape; feed the value into three
// phase-shifted sines for colour; advance time each frame to make it cycle.
(function(){
  var c = document.getElementById('c'), x = c.getContext('2d');
  var W, H, img, d, t = 0;
  function size(){
    // modest internal resolution (scaled up by CSS) so per-pixel stays smooth
    var s = Math.min(window.innerWidth, window.innerHeight) > 900 ? 520 : 420;
    W = c.width = s; H = c.height = s;
    img = x.createImageData(W, H); d = img.data;
  }
  window.addEventListener('resize', size); size();
  function frame(){
    for (var y = 0; y < H; y++){
      for (var px = 0; px < W; px++){
        var v = Math.sin(px * 0.04 + t)
              + Math.sin(y  * 0.03 - t)
              + Math.sin((px + y) * 0.03 + t)
              + Math.sin(Math.sqrt((px-W/2)*(px-W/2) + (y-H/2)*(y-H/2)) * 0.04 - t * 1.5);
        var h = v * 0.6 + t * 0.2;
        var i = (y * W + px) * 4;
        d[i]   = 128 + 127 * Math.sin(h);
        d[i+1] = 128 + 127 * Math.sin(h + 2.094);
        d[i+2] = 128 + 127 * Math.sin(h + 4.188);
        d[i+3] = 255;
      }
    }
    x.putImageData(img, 0, 0);
    t += 0.05;
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
